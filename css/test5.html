<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        #dv1{
            font-family: Arial, Helvetica, sans-serif;
            width: 350px;
            height: 550px;
            border: 1px solid #000;
        }
        #banner{
            width: 350px;
            height: 200px;
        }
        #banner-img{
            width: 350px;
            height: 200px;
            border: 1px solid #000;
        }
        #header{
            width: 350px;
            height: 75px;
            border: 1px solid #000;
        }
        #title{
            color: blueviolet;
            text-align: center;
            margin: 0;
            padding: 12px;
        }
        #body{
            width: 350px;
            height: 272px;
            border: 1px solid #000;
        }
        #body-text{
            margin: 0;
            padding: 12px;
            font-size: 18px;
            text-align: justify;
        }
    </style>
</head>
<body>
    <div id="dv1">
        <div id="banner">
            <img id="banner-img" src="images/toyota_fortuner_1.jpg" alt="toyota image">
        </div>
        <div id="header">
            <h1 id="title">Toyota Fontuner</h1>
        </div>
        <div id="body">
            <p id="body-text">
                While the first-generation Fortuner was developed in Thailand by Thai and Japanese engineers, its facelifted version, as well as the Hilux and Innova, was designed in Australia by Toyota Australia, which is also responsible for developing the second-generation model.
            </p>
        </div>
    </div>
</body>
</html>
